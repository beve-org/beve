[project]
name = "beve"
version = "0.1.0"
description = "BEVE (Binary Efficient Versatile Encoding) decoder with numpy arrays"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beve"]
